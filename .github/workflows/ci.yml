name: MacroPark Web CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_VISUAL_QA: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Capture visual QA
        run: |
          mkdir -p visual-qa
          npm run start -- -H 127.0.0.1 -p 3000 >/tmp/macropark-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ >/dev/null

          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium is not available on the runner."
            exit 1
          fi

          COMMON_FLAGS=(
            --headless=new
            --no-sandbox
            --disable-dev-shm-usage
            --disable-background-networking
            --disable-component-update
            --disable-default-apps
            --hide-scrollbars
            --no-first-run
            --enable-webgl
            --enable-unsafe-swiftshader
            --ignore-gpu-blocklist
            --use-angle=swiftshader
            --run-all-compositor-stages-before-draw
          )

          capture() {
            local size="$1"
            local budget="$2"
            local output="$3"
            local url="$4"

            echo "Capturing $output"
            if timeout --signal=KILL 35s "$CHROME_BIN" "${COMMON_FLAGS[@]}" \
              --window-size="$size" \
              --virtual-time-budget="$budget" \
              --screenshot="$output" \
              "$url"; then
              echo "Captured $output"
            else
              echo "::warning::Visual QA capture timed out or failed: $output"
              rm -f "$output"
            fi
          }

          # Core regression coverage
          capture 1440,1000 1400 visual-qa/desktop-arrival.png \
            http://127.0.0.1:3000/
          capture 1440,1000 1600 visual-qa/desktop-chooser.png \
            "http://127.0.0.1:3000/?qaChooser=1"
          capture 390,844 1600 visual-qa/mobile-chooser.png \
            "http://127.0.0.1:3000/?qaChooser=1"
          capture 1440,1000 2500 visual-qa/desktop-home-access.png \
            "http://127.0.0.1:3000/?qaEnvironment=home&qaProblem=automatic-access"
          capture 1440,1000 2300 visual-qa/desktop-home-guest-expired.png \
            "http://127.0.0.1:3000/?qaEnvironment=home&qaProblem=guest-access&qaGuest=expired"
          capture 1440,1000 1900 visual-qa/desktop-home-ev-solar.png \
            "http://127.0.0.1:3000/?qaEnvironment=home&qaProblem=ev-charging&qaSolar=1"

          # Retail entrance flow + existing guidance regression
          capture 1440,1000 3300 visual-qa/desktop-retail-entrance-flow.png \
            "http://127.0.0.1:3000/?qaEnvironment=retail&qaProblem=reduce-queues"
          capture 390,844 3300 visual-qa/mobile-retail-entrance-flow.png \
            "http://127.0.0.1:3000/?qaEnvironment=retail&qaProblem=reduce-queues"
          capture 1440,1000 1900 visual-qa/desktop-retail-guidance.png \
            "http://127.0.0.1:3000/?qaEnvironment=retail&qaProblem=parking-guidance"

          # Residence resident / assigned-space journey
          capture 1440,1000 2200 visual-qa/desktop-residence-recognition.png \
            "http://127.0.0.1:3000/?qaEnvironment=residence&qaProblem=protect-space"
          capture 1440,1000 5600 visual-qa/desktop-residence-parked.png \
            "http://127.0.0.1:3000/?qaEnvironment=residence&qaProblem=protect-space"

          # Residence reservation journey: amber waiting state -> matched/parked state
          capture 1440,1000 1700 visual-qa/desktop-residence-reserved.png \
            "http://127.0.0.1:3000/?qaEnvironment=residence&qaProblem=reservations"
          capture 1440,1000 5200 visual-qa/desktop-residence-reservation-matched.png \
            "http://127.0.0.1:3000/?qaEnvironment=residence&qaProblem=reservations"

          # Residence guest access active vs expired
          capture 1440,1000 4200 visual-qa/desktop-residence-guest-active.png \
            "http://127.0.0.1:3000/?qaEnvironment=residence&qaProblem=guest-access"
          capture 1440,1000 2600 visual-qa/desktop-residence-guest-expired.png \
            "http://127.0.0.1:3000/?qaEnvironment=residence&qaProblem=guest-access&qaGuest=expired"

          # Residence shared EV charging + solar and portrait regression
          capture 1440,1000 2500 visual-qa/desktop-residence-ev-solar.png \
            "http://127.0.0.1:3000/?qaEnvironment=residence&qaProblem=ev-charging&qaSolar=1"
          capture 390,844 2700 visual-qa/mobile-residence-guest-expired.png \
            "http://127.0.0.1:3000/?qaEnvironment=residence&qaProblem=guest-access&qaGuest=expired"
          capture 390,844 2400 visual-qa/mobile-residence-ev.png \
            "http://127.0.0.1:3000/?qaEnvironment=residence&qaProblem=ev-charging"

      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macropark-visual-qa
          path: visual-qa
          if-no-files-found: warn
          retention-days: 7
