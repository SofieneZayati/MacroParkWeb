name: MacroPark Web CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_VISUAL_QA: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Capture visual QA
        run: |
          mkdir -p visual-qa
          npm run start -- -H 127.0.0.1 -p 3000 >/tmp/macropark-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ >/dev/null

          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium is not available on the runner."
            exit 1
          fi

          COMMON_FLAGS=(
            --headless=new
            --no-sandbox
            --disable-dev-shm-usage
            --disable-background-networking
            --disable-component-update
            --disable-default-apps
            --hide-scrollbars
            --no-first-run
            --enable-webgl
            --enable-unsafe-swiftshader
            --ignore-gpu-blocklist
            --use-angle=swiftshader
            --run-all-compositor-stages-before-draw
          )

          capture() {
            local size="$1"
            local budget="$2"
            local output="$3"
            local url="$4"

            echo "Capturing $output"
            timeout --signal=KILL 40s "$CHROME_BIN" "${COMMON_FLAGS[@]}" \
              --window-size="$size" \
              --virtual-time-budget="$budget" \
              --screenshot="$output" \
              "$url"
          }

          capture 1440,1000 1400 visual-qa/desktop-arrival.png \
            http://127.0.0.1:3000/

          capture 1440,1000 1800 visual-qa/desktop-chooser.png \
            "http://127.0.0.1:3000/?qaChooser=1"

          capture 390,844 1800 visual-qa/mobile-chooser.png \
            "http://127.0.0.1:3000/?qaChooser=1"

          capture 1440,1000 2400 visual-qa/desktop-home-ev-solar.png \
            "http://127.0.0.1:3000/?qaEnvironment=home&qaProblem=ev-charging&qaSolar=1"

          capture 1440,1000 2400 visual-qa/desktop-residence-protection.png \
            "http://127.0.0.1:3000/?qaEnvironment=residence&qaProblem=protect-space"

          capture 1440,1000 2400 visual-qa/desktop-retail-guidance.png \
            "http://127.0.0.1:3000/?qaEnvironment=retail&qaProblem=parking-guidance"

      - name: Upload visual QA
        uses: actions/upload-artifact@v7
        with:
          name: macropark-visual-qa
          path: visual-qa
          if-no-files-found: error
          retention-days: 7
